<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعلام عن استحقاق المعينة السمعية</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: right; }
        .header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #eaeaea; padding-bottom: 15px; }
        .header h2 { color: #1b4f72; margin: 0 0 5px 0; }
        .header p { color: #666; font-size: 13px; margin: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; font-size: 14px; }
        input { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; background: #fafafa; }
        input:focus { border-color: #1b4f72; background: #fff; outline: none; }
        button { background-color: #27ae60; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #219653; }
        #result { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; text-align: right; font-size: 14px; line-height: 1.8; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .not-eligible { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>استعلام عن استحقاق المعينة السمعية</h2>
        <p>مستشفى اليرموك والمدينة الطبية - إدارة السجلات</p>
    </div>
    
    <form id="patientSearchForm">
        <div class="form-group">
            <label for="fullName">اسم المريض الثلاثي:</label>
            <input type="text" id="fullName" required placeholder="أدخل اسم المريض الثلاثي">
        </div>

        <div class="form-group">
            <label for="motherName">اسم الأم:</label>
            <input type="text" id="motherName" required placeholder="أدخل اسم الأم">
        </div>

        <button type="submit">بحث عن حالة الاستحقاق</button>
    </form>

    <div id="result"></div>
</div>

<script>
    document.getElementById('patientSearchForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const searchInput = document.getElementById('fullName').value.trim().toLowerCase();
        const motherInput = document.getElementById('motherName').value.trim().toLowerCase();
        const resultDiv = document.getElementById('result');

        resultDiv.style.display = 'block';
        resultDiv.className = '';
        resultDiv.innerHTML = 'جاري البحث في السجلات...';

        try {
            const response = await fetch('/api/records');
            const data = await response.json();

            if (data.success && Array.isArray(data.records)) {
                const found = data.records.find(p => {
                    const pName = String(p['اسم المريض'] || '').trim().toLowerCase();
                    const pMother = String(p['اسم الأم'] || '').trim().toLowerCase();
                    
                    return pName.includes(searchInput) && pMother.includes(motherInput);
                });

                if (found) {
                    // قراءة الأعمدة العربية المطابقة تماماً لجدولك
                    const pName = found['اسم المريض'] || 'غير متوفر';
                    const pMother = found['اسم الأم'] || 'غير متوفر';
                    const pDevice = found['تفاصيل السماعة'] || 'غير متوفر';
                    const pSerial = found['الرقم التسلسلي'] || '-';
                    const pDate = found['تاريخ الصرف'] || 'غير متوفر';
                    const pInst = found['المؤسسة / المركز'] || 'غير متوفر';
                    const pId = found['الرقم الوطني'] && found['الرقم الوطني'] !== '-' ? found['الرقم الوطني'] : null;
                    const pBirth = found['تاريخ الولادة'] && found['تاريخ الولادة'] !== '-' ? found['تاريخ الولادة'] : null;

                    // المريض صرف مسبقاً في تاريخ 27/04/2025 إذن هو غير مستحق حالياً
                    let isEligible = false; 

                    resultDiv.className = isEligible ? 'success' : 'not-eligible';
                    const statusText = isEligible ? '✓ مستحق لصرف المعينة السمعية الجديدة' : '✗ غير مستحق حالياً (لوجود صرف سابق بتاريخ ' + pDate + ')';

                    let htmlContent = `<strong>حالة الاستعلام: ${statusText}</strong><br><hr style="border:0; border-top:1px solid #ccc; margin:10px 0;">`;
                    htmlContent += `• اسم المريض: <b>${pName}</b><br>`;
                    htmlContent += `• اسم الأم: <b>${pMother}</b><br>`;
                    
                    if (pId) htmlContent += `• الرقم الوطني: ${pId}<br>`;
                    if (pBirth) htmlContent += `• تاريخ الولادة: ${pBirth}<br>`;
                    
                    htmlContent += `• تفاصيل السماعة السابقة: <b>${pDevice}</b><br>`;
                    htmlContent += `• الرقم التسلسلي: <b>${pSerial}</b><br>`;
                    htmlContent += `• تاريخ آخر صرف: <b>${pDate}</b><br>`;
                    htmlContent += `• المؤسسة / المركز: <b>${pInst}</b>`;

                    resultDiv.innerHTML = htmlContent;
                } else {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = '✗ عذراً، لم يتم العثور على سجل مطابق للبيانات المدخلة في السجلات.';
                }
            } else {
                resultDiv.className = 'error';
                resultDiv.innerHTML = '✗ تعذر الوصول إلى قاعدة البيانات.';
            }
        } catch (err) {
            resultDiv.className = 'error';
            resultDiv.innerHTML = '✗ حدث خطأ في الاتصال بالسيرفر.';
        }
    });
</script>

</body>
</html>
