<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام سجلات السماعات الطبية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #27ae60;
            padding-bottom: 8px;
        }
        .card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        label {
            font-weight: bold;
            font-size: 0.9em;
            color: #34495e;
            display: block;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1f618d;
        }
        .btn-check {
            background-color: #27ae60;
        }
        .btn-check:hover {
            background-color: #1e8449;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #34495e;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        .no-data {
            color: #7f8c8d;
            padding: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. فحص الاستحقاق -->
    <div class="card">
        <h2>1. بحث وفحص الاستحقاق بالرقم الوطني</h2>
        <div class="form-group">
            <div>
                <label>الرقم الوطني:</label>
                <input type="text" id="checkNationalId" placeholder="أدخل الرقم الوطني للفحص">
            </div>
        </div>
        <button class="btn-check" onclick="checkEligibility()">بحث وفحص الاستحقاق</button>
    </div>

    <!-- 2. تسجيل مريض جديد -->
    <div class="card">
        <h2>2. تسجيل مريض جديد وصرف سماعة</h2>
        <div class="form-group">
            <div>
                <label>الرقم الوطني:</label>
                <input type="text" id="national_id" required placeholder="أدخل الرقم الوطني">
            </div>
            <div>
                <label>اسم المريض:</label>
                <input type="text" id="patient_name" required placeholder="الاسم الكامل">
            </div>
            <div>
                <label>اسم الأم:</label>
                <input type="text" id="mother_name" placeholder="اسم الأم">
            </div>
            <div>
                <label>سنة الولادة:</label>
                <input type="number" id="birth_year" placeholder="1991">
            </div>
        </div>

        <div class="form-group">
            <div>
                <label>تفاصيل السماعة:</label>
                <select id="device_details">
                    <!-- سيتم تحميل الخيارات ديناميكياً -->
                </select>
            </div>
            <div>
                <label>الرقم التسلسلي (Serial Number):</label>
                <input type="text" id="serial_number" required placeholder="أدخل الرقم التسلسلي">
            </div>
        </div>

        <button onclick="registerAndIssue()">حفظ وصرف السماعة</button>
    </div>

    <!-- 3. سجل الذين تم الصرف لهم -->
    <div class="card">
        <h2>📋 سجل الذين تم الصرف لهم (<span id="recordCount">0</span>)</h2>
        <table>
            <thead>
                <tr>
                    <th>اسم المريض</th>
                    <th>اسم الأم</th>
                    <th>الرقم الوطني</th>
                    <th>سنة الولادة</th>
                    <th>تفاصيل السماعة</th>
                    <th>الرقم التسلسلي</th>
                    <th>تاريخ الصرف</th>
                    <th>المؤسسة / المركز</th>
                </tr>
            </thead>
            <tbody id="recordsTableBody">
                <tr>
                    <td colspan="8" class="no-data">لا توجد سجلات مطابقة</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const institutionCode = 'yarmok'; // كود المؤسسة الحالية

    window.onload = function() {
        loadData();
    };

    // جلب البيانات من الخادم وتحميل السجل
    async function loadData() {
        try {
            const response = await fetch(`/api/records?code=${institutionCode}`);
            const data = await response.json();

            // 1. تحديث قائمة خيارات السماعات
            const deviceSelect = document.getElementById('device_details');
            deviceSelect.innerHTML = '';
            if (data.deviceOptions && data.deviceOptions.length > 0) {
                data.deviceOptions.forEach(device => {
                    const opt = document.createElement('option');
                    opt.value = device;
                    opt.textContent = device;
                    deviceSelect.appendChild(opt);
                });
            }

            // 2. تحديث جدول السجلات
            renderTable(data.records || []);
        } catch (error) {
            console.error('خطأ في جلب البيانات:', error);
        }
    }

    // عرض السجلات داخل الجدول
    function renderTable(records) {
        const tbody = document.getElementById('recordsTableBody');
        const countSpan = document.getElementById('recordCount');
        
        tbody.innerHTML = '';
        countSpan.textContent = records.length;

        if (!records || records.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="no-data">لا توجد سجلات مطابقة</td></tr>';
            return;
        }

        records.forEach(r => {
            const tr = document.createElement('tr');
            const formattedDate = r.date ? r.date.split('T')[0] : '';
            tr.innerHTML = `
                <td>${r.patient_name || ''}</td>
                <td>${r.mother_name || ''}</td>
                <td>${r.national_id || ''}</td>
                <td>${r.birth_year || ''}</td>
                <td>${r.device_details || ''}</td>
                <td>${r.serial_number || ''}</td>
                <td>${formattedDate}</td>
                <td>${r.institution_name || ''}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // حفظ وصرف سماعة جديدة
    async function registerAndIssue() {
        const national_id = document.getElementById('national_id').value.trim();
        const patient_name = document.getElementById('patient_name').value.trim();
        const mother_name = document.getElementById('mother_name').value.trim();
        const birth_year = document.getElementById('birth_year').value.trim();
        const device_details = document.getElementById('device_details').value;
        const serial_number = document.getElementById('serial_number').value.trim();

        if (!national_id || !patient_name || !serial_number) {
            alert('يرجى ملء كافة الحقول المطلوبة (الرقم الوطني، اسم المريض، الرقم التسلسلي)');
            return;
        }

        const recordData = {
            national_id,
            patient_name,
            mother_name,
            birth_year,
            device_details,
            serial_number
        };

        try {
            const response = await fetch(`/api/records?code=${institutionCode}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(recordData)
            });

            const result = await response.json();

            if (result.success) {
                alert('✅ ' + result.message);
                
                // تفريغ الحقول بعد الحفظ
                document.getElementById('national_id').value = '';
                document.getElementById('patient_name').value = '';
                document.getElementById('mother_name').value = '';
                document.getElementById('birth_year').value = '';
                document.getElementById('serial_number').value = '';

                // إعادة تحميل البيانات فوراً لتحديث الجدول
                loadData();
            } else {
                alert('❌ ' + (result.error || 'حدث خطأ أثناء الحفظ'));
            }
        } catch (error) {
            console.error('خطأ أثناء حفظ البيانات:', error);
            alert('حدث خطأ في الاتصال بالخادم');
        }
    }

    // بحث وفحص الاستحقاق
    async function checkEligibility() {
        const natId = document.getElementById('checkNationalId').value.trim();
        if (!natId) {
            alert('يرجى إدخال الرقم الوطني للبحث');
            return;
        }

        try {
            const response = await fetch(`/api/check-patient/${natId}`);
            const result = await response.json();
            alert(result.message);
        } catch (error) {
            console.error('خطأ أثناء فحص الاستحقاق:', error);
            alert('حدث خطأ في فحص بيانات المريض');
        }
    }
</script>

</body>
</html>
