<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة وصرف السماعات الطبية</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2, h3 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        td[contenteditable="true"] {
            background-color: #fff9c4;
            cursor: pointer;
        }
        td[contenteditable="true"]:focus {
            background-color: #ffffff;
            outline: 2px solid #3498db;
        }
        .alert {
            padding: 10px;
            background-color: #e74c3c;
            color: white;
            margin-bottom: 15px;
            border-radius: 4px;
            display: none;
        }
        .success {
            background-color: #2ecc71;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 id="system-title">نظام إدارة الصرف</h2>
    <div id="msg" class="alert"></div>

    <div class="form-group">
        <label>اسم المريض:</label>
        <input type="text" id="patientName" placeholder="أدخل اسم المريض">
    </div>
    <div class="form-group">
        <label>اسم الأم:</label>
        <input type="text" id="motherName" placeholder="أدخل اسم الأم">
    </div>
    <div class="form-group">
        <label>الرقم الوطني:</label>
        <input type="text" id="nationalId" placeholder="أدخل الرقم الوطني">
    </div>
    <div class="form-group">
        <label>تاريخ الولادة:</label>
        <input type="date" id="birthDate">
    </div>
    <div class="form-group">
        <label>تفاصيل السماعة:</label>
        <input type="text" id="deviceDetails" placeholder="مثال: oticon xceed 3 up">
    </div>
    <div class="form-group">
        <label>الرقم التسلسلي:</label>
        <input type="text" id="serialNumber" placeholder="أدخل الرقم التسلسلي">
    </div>

    <button onclick="saveRecord()">حفظ وتسجيل الصرف</button>

    <h3>سجل الذين تم الصرف لهم (<span id="total-count">0</span>)</h3>
    <table id="recordsTable">
        <thead>
            <tr>
                <th>اسم المريض</th>
                <th>اسم الأم</th>
                <th>الرقم الوطني</th>
                <th>تاريخ الولادة</th>
                <th>تفاصيل السماعة</th>
                <th>الرقم التسلسلي</th>
                <th>تاريخ الصرف</th>
                <th>المؤسسة / المركز</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- سيتم تعبئة البيانات ديناميكياً -->
        </tbody>
    </table>
</div>

<script>
    // تحديد الجهة بناءً على الرابط ?code=...
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code') || 'general';
    
    let currentCenter = "المؤسسة العامة";
    if(code === 'yarmok') currentCenter = "مستشفى اليرموك";
    else if(code === 'medicity') currentCenter = "مدينة الطب";

    document.getElementById('system-title').innerText = `نظام إدارة الصرف - ${currentCenter}`;

    async function loadRecords() {
        try {
            const res = await fetch('/api/records');
            const data = await res.json();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            let count = 0;
            data.forEach((rec, index) => {
                count++;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td contenteditable="true" onblur="updateRecord(${index}, 'patientName', this.innerText)">${rec.patientName || ''}</td>
                    <td contenteditable="true" onblur="updateRecord(${index}, 'motherName', this.innerText)">${rec.motherName || ''}</td>
                    <td contenteditable="true" onblur="updateRecord(${index}, 'nationalId', this.innerText)">${rec.nationalId || ''}</td>
                    <td contenteditable="true" onblur="updateRecord(${index}, 'birthDate', this.innerText)">${rec.birthDate || ''}</td>
                    <td contenteditable="true" onblur="updateRecord(${index}, 'deviceDetails', this.innerText)">${rec.deviceDetails || ''}</td>
                    <td contenteditable="true" onblur="updateRecord(${index}, 'serialNumber', this.innerText)">${rec.serialNumber || ''}</td>
                    <td>${rec.date || ''}</td>
                    <td>${rec.center || currentCenter}</td>
                `;
                tbody.appendChild(tr);
            });
            document.getElementById('total-count').innerText = count;
        } catch (e) {
            console.error("خطأ في جلب البيانات", e);
        }
    }

    async function saveRecord() {
        const record = {
            patientName: document.getElementById('patientName').value,
            motherName: document.getElementById('motherName').value,
            nationalId: document.getElementById('nationalId').value,
            birthDate: document.getElementById('birthDate').value,
            deviceDetails: document.getElementById('deviceDetails').value,
            serialNumber: document.getElementById('serialNumber').value,
            date: new Date().toISOString().split('T')[0],
            center: currentCenter
        };

        if(!record.patientName || !record.serialNumber) {
            showAlert("يرجى إدخال اسم المريض والرقم التسلسلي على الأقل", false);
            return;
        }

        const res = await fetch('/api/records', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(record)
        });

        if(res.ok) {
            showAlert("تم الحفظ بنجاح", true);
            document.getElementById('patientName').value = '';
            document.getElementById('motherName').value = '';
            document.getElementById('nationalId').value = '';
            document.getElementById('birthDate').value = '';
            document.getElementById('deviceDetails').value = '';
            document.getElementById('serialNumber').value = '';
            loadRecords();
        } else {
            showAlert("حدث خطأ أثناء الحفظ", false);
        }
    }

    async function updateRecord(index, field, value) {
        try {
            await fetch(`/api/records/${index}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ field, value })
            });
        } catch (e) {
            console.error("فشل التحديث", e);
        }
    }

    function showAlert(msg, isSuccess) {
        const m = document.getElementById('msg');
        m.innerText = msg;
        m.className = "alert " + (isSuccess ? "success" : "");
        m.style.display = "block";
        setTimeout(() => m.style.display = "none", 3000);
    }

    loadRecords();
</script>

</body>
</html>
