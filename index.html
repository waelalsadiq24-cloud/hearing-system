<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعلام عن استحقاق السماعة الطبية</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { background-color: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 20px; padding: 15px; border-radius: 5px; text-align: right; display: none; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>استعلام عن استحقاق السماعة الطبية</h2>
    <form id="searchForm">
        <div class="form-group">
            <label for="query">أدخل الرقم الوطني أو اسم المريض:</label>
            <input type="text" id="query" required placeholder="مثال: أحمد محمد أو الرقم الوطني">
        </div>
        <button type="submit">بحث</button>
    </form>
    <div id="result"></div>
</div>

<script>
    document.getElementById('searchForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const query = document.getElementById('query').value;
        const resultDiv = document.getElementById('result');
        
        resultDiv.style.display = 'block';
        resultDiv.className = '';
        resultDiv.innerHTML = 'جاري البحث...';

        try {
            const response = await fetch(`/api/public-search?q=${encodeURIComponent(query)}`);
            const data = await response.json();

            if (data.found) {
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `<strong>نتيجة البحث:</strong><br>
                    المريض: ${data.patient.name}<br>
                    حالة الاستحقاق: ${data.patient.status}<br>
                    تاريخ آخر صرف: ${data.patient.lastDate || 'غير متوفر'}
                `;
            } else {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = 'عذراً، لم يتم العثور على بيانات مطابقة أو أن المريض غير مستحق حالياً.';
            }
        } catch (error) {
            resultDiv.className = 'result error';
            resultDiv.innerHTML = 'حدث خطأ في الاتصال بالسيرفر، يرجى المحاولة لاحقاً.';
        }
    });
</script>

</body>
</html>
