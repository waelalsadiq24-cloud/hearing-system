<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة وصرف السماعات الطبية</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .section-box {
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            background-color: #ffffff;
        }
        .section-title {
            font-size: 17px;
            font-weight: bold;
            color: #4a235a;
            margin-bottom: 15px;
            border-bottom: 2px solid #af7ac5;
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #2c3e50;
            font-size: 14px;
        }
        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            width: 100%;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }
        .date-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 5px;
        }
        .btn-submit {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background-color: #1f618d;
        }
        .table-header-bar {
            background-color: #34495e;
            color: white;
            padding: 12px 15px;
            border-radius: 6px 6px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .delete-mode-btn {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .search-table-input {
            padding: 6px 10px;
            border-radius: 4px;
            border: none;
            width: 220px;
            font-size: 14px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .center-badge {
            text-align: center;
            font-weight: bold;
            color: #2980b9;
            margin-bottom: 15px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="centerBadge" class="center-badge">المؤسسة / المركز: جاري التححديد...</div>

    <!-- 2. تسجيل مريض جديد وصرف سماعة -->
    <div class="section-box">
        <div class="section-title">➕ 2. تسجيل مريض جديد وصرف سماعة</div>
        
        <div class="form-grid">
            <div class="form-group">
                <label>الرقم الوطني:</label>
                <input type="text" id="nationalId" placeholder="الرقم الوطني">
            </div>
            <div class="form-group">
                <label>اسم المريض:</label>
                <input type="text" id="patientName" placeholder="الاسم الكامل">
            </div>
            
            <div class="form-group">
                <label>اسم الأم:</label>
                <input type="text" id="motherName" placeholder="اسم الأم">
            </div>
            <div class="form-group">
                <label>تاريخ الولادة (يوم / شهر / سنة):</label>
                <div class="date-grid">
                    <input type="number" id="birthDay" placeholder="اليوم" min="1" max="31">
                    <input type="number" id="birthMonth" placeholder="الشهر" min="1" max="12">
                    <input type="number" id="birthYear" placeholder="السنة" min="1900" max="2026">
                </div>
            </div>

            <div class="form-group">
                <label>تفاصيل السماعة:</label>
                <input type="text" id="deviceDetails" placeholder="-- اختر السماعة أو أضف جديدة --">
            </div>
            <div class="form-group">
                <label>الرقم التسلسلي (Serial Number):</label>
                <input type="text" id="serialNumber" placeholder="أدخل الرقم التسلسلي للسماعة">
            </div>
        </div>

        <button class="btn-submit" onclick="saveRecord()">حفظ وصرف السماعة</button>
    </div>

    <!-- سجل الذين تم الصرف لهم -->
    <div class="section-box" style="padding: 0; overflow: hidden;">
        <div style="padding: 15px; font-weight: bold; color: #2c3e50; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 5px;">
            📋 سجل الذين تم الصرف لهم
        </div>

        <div class="table-header-bar">
            <div>
                <button class="delete-mode-btn" onclick="toggleDeleteMode()" id="deleteModeBtn">🗑️ تفعيل وضع الحذف (معطل)</button>
                <span id="total-count" style="margin-right: 15px; font-weight: bold;">مجموع الأسماء: 0</span>
            </div>
            <div>
                <input type="text" id="tableSearch" class="search-table-input" placeholder="🔍 تصفية الجدول..." onkeyup="filterTable()">
            </div>
        </div>

        <table id="recordsTable">
            <thead>
                <tr>
                    <th>اسم المريض</th>
                    <th>اسم الأم</th>
                    <th>الرقم الوطني</th>
                    <th>تاريخ الولادة</th>
                    <th>تفاصيل السماعة</th>
                    <th>الرقم التسلسلي</th>
                    <th>تاريخ الصرف</th>
                    <th>المؤسسة / المركز</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- بيانات ديناميكية -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code') || 'general';
    
    let currentCenter = "المؤسسة العامة";
    if (code === '10') currentCenter = "مركز الكود 10";
    else if (code === 'yarmok') currentCenter = "مستشفى اليرموك";
    else if (code === 'medicity') currentCenter = "مدينة الطب";

    document.getElementById('centerBadge').innerText = `المؤسسة / المركز: ${currentCenter}`;

    let deleteMode = false;

    function toggleDeleteMode() {
        deleteMode = !deleteMode;
        const btn = document.getElementById('deleteModeBtn');
        if (deleteMode) {
            btn.style.background = "#c0392b";
            btn.innerText = "🗑️ تفعيل وضع الحذف (مفعل - انقر مزدوجاً للحذف)";
        } else {
            btn.style.background = "#e67e22";
            btn.innerText = "🗑️ تفعيل وضع الحذف (معطل)";
        }
    }

    async function loadRecords() {
        try {
            const res = await fetch('/api/records');
            const data = await res.json();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            data.forEach((rec, index) => {
                const tr = document.createElement('tr');
                if (deleteMode) {
                    tr.title = "انقر مرتين للحذف";
                    tr.style.cursor = "pointer";
                    tr.ondblclick = () => deleteRecord(index);
                }
                tr.innerHTML = `
                    <td>${rec.patientName || ''}</td>
                    <td>${rec.motherName || ''}</td>
                    <td>${rec.nationalId || ''}</td>
                    <td>${rec.birthDate || ''}</td>
                    <td>${rec.deviceDetails || ''}</td>
                    <td>${rec.serialNumber || ''}</td>
                    <td>${rec.date || ''}</td>
                    <td>${rec.center || currentCenter}</td>
                `;
                tbody.appendChild(tr);
            });
            document.getElementById('total-count').innerText = `مجموع الأسماء: ${data.length}`;
        } catch (e) {
            console.error("خطأ في جلب البيانات", e);
        }
    }

    async function saveRecord() {
        const day = document.getElementById('birthDay').value;
        const month = document.getElementById('birthMonth').value;
        const year = document.getElementById('birthYear').value;
        const birthDate = (day && month && year) ? `${day}/${month}/${year}` : '';

        const record = {
            nationalId: document.getElementById('nationalId').value,
            patientName: document.getElementById('patientName').value,
            motherName: document.getElementById('motherName').value,
            birthDate: birthDate,
            deviceDetails: document.getElementById('deviceDetails').value,
            serialNumber: document.getElementById('serialNumber').value,
            date: new Date().toISOString().split('T')[0],
            center: currentCenter
        };

        if (!record.patientName || !record.nationalId || !record.serialNumber) {
            alert("يرجى إدخال الحقول الأساسية (الرقم الوطني، اسم المريض، والرقم التسلسلي)");
            return;
        }

        const res = await fetch('/api/records', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(record)
        });

        if (res.ok) {
            alert("تم حفظ وصرف السماعة بنجاح");
            document.getElementById('nationalId').value = '';
            document.getElementById('patientName').value = '';
            document.getElementById('motherName').value = '';
            document.getElementById('birthDay').value = '';
            document.getElementById('birthMonth').value = '';
            document.getElementById('birthYear').value = '';
            document.getElementById('deviceDetails').value = '';
            document.getElementById('serialNumber').value = '';
            loadRecords();
        } else {
            alert("حدث خطأ أثناء الحفظ");
        }
    }

    async function deleteRecord(index) {
        if (confirm("هل أنت متأكد من حذف هذا السجل؟")) {
            try {
                const res = await fetch(`/api/records/${index}`, { method: 'DELETE' });
                if (res.ok) {
                    loadRecords();
                } else {
                    alert("فشل الحذف");
                }
            } catch (e) {
                console.error(e);
            }
        }
    }

    function filterTable() {
        const input = document.getElementById('tableSearch').value.toLowerCase();
        const rows = document.getElementById('tableBody').getElementsByTagName('tr');
        for (let row of rows) {
            let match = false;
            const cells = row.getElementsByTagName('td');
            for (let cell of cells) {
                if (cell.innerText.toLowerCase().includes(input)) {
                    match = true;
                    break;
                }
            }
            row.style.display = match ? '' : 'none';
        }
    }

    loadRecords();
</script>

</body>
</html>
