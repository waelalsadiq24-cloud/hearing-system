<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة وصرف السماعات الطبية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #34495e;
        }
        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        input:focus, select:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }
        .btn-container {
            text-align: center;
            margin-top: 20px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        hr {
            margin: 40px 0;
            border: 0;
            border-top: 1px solid #eee;
        }
        h3 {
            color: #2c3e50;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .center-badge {
            display: inline-block;
            background: #e1f5fe;
            color: #0288d1;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align: center;">
        <span id="centerBadge" class="center-badge">المؤسسة / المركز: جاري التحميل...</span>
    </div>
    <h2>نظام سجلات السماعات الطبية</h2>

    <div class="form-grid">
        <div class="form-group">
            <label for="patientName">اسم المريض:</label>
            <input type="text" id="patientName" placeholder="أدخل اسم المريض">
        </div>
        <div class="form-group">
            <label for="motherName">اسم الأم:</label>
            <input type="text" id="motherName" placeholder="أدخل اسم الأم">
        </div>
        <div class="form-group">
            <label for="nationalId">الرقم الوطني:</label>
            <input type="text" id="nationalId" placeholder="أدخل الرقم الوطني">
        </div>
        <div class="form-group">
            <label for="birthDate">تاريخ الولادة:</label>
            <input type="date" id="birthDate">
        </div>
        <div class="form-group">
            <label for="deviceDetails">تفاصيل السماعة:</label>
            <input type="text" id="deviceDetails" placeholder="مثال: oticon xceed 3 up">
        </div>
        <div class="form-group">
            <label for="serialNumber">الرقم التسلسلي:</label>
            <input type="text" id="serialNumber" placeholder="أدخل الرقم التسلسلي">
        </div>
    </div>

    <div class="btn-container">
        <button onclick="saveRecord()">حفظ وتسجيل الصرف</button>
    </div>

    <hr>

    <h3>سجل الذين تم الصرف لهم</h3>
    <table id="recordsTable">
        <thead>
            <tr>
                <th>اسم المريض</th>
                <th>اسم الأم</th>
                <th>الرقم الوطني</th>
                <th>تاريخ الولادة</th>
                <th>تفاصيل السماعة</th>
                <th>الرقم التسلسلي</th>
                <th>تاريخ الصرف</th>
                <th>المؤسسة / المركز</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- سيتم تعبئة البيانات ديناميكياً -->
        </tbody>
    </table>
</div>

<script>
    // تحديد الجهة أو المركز بناءً على البارامتر في الرابط مثل ?code=10 أو ?code=yarmok
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code') || 'general';
    
    let currentCenter = "المؤسسة العامة";
    if (code === '10') {
        currentCenter = "مركز الكود 10";
    } else if (code === 'yarmok') {
        currentCenter = "مستشفى اليرموك";
    } else if (code === 'medicity') {
        currentCenter = "مدينة الطب";
    }

    document.getElementById('centerBadge').innerText = `المؤسسة / المركز: ${currentCenter}`;

    async function loadRecords() {
        try {
            const res = await fetch('/api/records');
            const data = await res.json();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            data.forEach(rec => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${rec.patientName || ''}</td>
                    <td>${rec.motherName || ''}</td>
                    <td>${rec.nationalId || ''}</td>
                    <td>${rec.birthDate || ''}</td>
                    <td>${rec.deviceDetails || ''}</td>
                    <td>${rec.serialNumber || ''}</td>
                    <td>${rec.date || ''}</td>
                    <td>${rec.center || currentCenter}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) {
            console.error("خطأ في جلب البيانات", e);
        }
    }

    async function saveRecord() {
        const record = {
            patientName: document.getElementById('patientName').value,
            motherName: document.getElementById('motherName').value,
            nationalId: document.getElementById('nationalId').value,
            birthDate: document.getElementById('birthDate').value,
            deviceDetails: document.getElementById('deviceDetails').value,
            serialNumber: document.getElementById('serialNumber').value,
            date: new Date().toISOString().split('T')[0],
            center: currentCenter
        };

        if (!record.patientName || !record.serialNumber) {
            alert("يرجى إدخال اسم المريض والرقم التسلسلي على الأقل");
            return;
        }

        const res = await fetch('/api/records', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(record)
        });

        if (res.ok) {
            alert("تم الحفظ بنجاح");
            document.getElementById('patientName').value = '';
            document.getElementById('motherName').value = '';
            document.getElementById('nationalId').value = '';
            document.getElementById('birthDate').value = '';
            document.getElementById('deviceDetails').value = '';
            document.getElementById('serialNumber').value = '';
            loadRecords();
        } else {
            alert("حدث خطأ أثناء الحفظ");
        }
    }

    loadRecords();
</script>

</body>
</html>
