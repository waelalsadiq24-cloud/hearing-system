<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام فحص وتسجيل وصرف السماعات الطبية</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .section-box {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            background-color: #fafafa;
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #34495e;
            font-size: 14px;
        }
        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }
        input:focus, select:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }
        .date-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 5px;
        }
        .btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #27ae60;
        }
        .btn-primary {
            background-color: #3498db;
        }
        .btn-primary:hover {
            background-color: #2980b9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .center-badge {
            display: inline-block;
            background: #e1f5fe;
            color: #0288d1;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .result-box {
            margin-top: 15px;
            padding: 10px;
            background: #e8f8f5;
            border: 1px solid #a3e4d7;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align: center;">
        <span id="centerBadge" class="center-badge">المؤسسة / المركز: جاري التحميل...</span>
    </div>
    <h2>🩺 نظام فحص وتسجيل وصرف السماعات الطبية</h2>

    <!-- قسم البحث وفحص الاستحقاق -->
    <div class="section-box">
        <div class="section-title">🔍 1. البحث عن مريض وفحص الاستحقاق</div>
        <div class="form-group">
            <label>بحث بالرقم الوطني:</label>
            <input type="text" id="searchNationalId" placeholder="أدخل الرقم الوطني للبحث">
        </div>
        <button class="btn btn-primary" onclick="checkEligibility()" style="margin-top: 10px;">بحث وفحص الاستحقاق</button>
        <div id="searchResult" class="result-box"></div>
    </div>

    <!-- قسم تسجيل مريض جديد وصرف سماعة -->
    <div class="section-box">
        <div class="section-title">➕ 2. تسجيل مريض جديد وصرف سماعة</div>
        <div class="form-grid">
            <div class="form-group">
                <label>الرقم الوطني:</label>
                <input type="text" id="nationalId" placeholder="الرقم الوطني">
            </div>
            <div class="form-group">
                <label>اسم المريض:</label>
                <input type="text" id="patientName" placeholder="الاسم الكامل">
            </div>
            <div class="form-group">
                <label>اسم الأم:</label>
                <input type="text" id="motherName" placeholder="اسم الأم">
            </div>
            <div class="form-group">
                <label>تاريخ الولادة (يوم / شهر / سنة):</label>
                <div class="date-grid">
                    <input type="number" id="birthDay" placeholder="اليوم" min="1" max="31">
                    <input type="number" id="birthMonth" placeholder="الشهر" min="1" max="12">
                    <input type="number" id="birthYear" placeholder="السنة" min="1900" max="2026">
                </div>
            </div>
            <div class="form-group">
                <label>تفاصيل السماعة:</label>
                <input type="text" id="deviceDetails" placeholder="اختر السماعة أو أضف جديدة">
            </div>
            <div class="form-group">
                <label>الرقم التسلسلي (Serial Number):</label>
                <input type="text" id="serialNumber" placeholder="أدخل الرقم التسلسلي للسماعة">
            </div>
        </div>
        <button class="btn" onclick="saveRecord()">حفظ وتسجيل الصرف</button>
    </div>

    <!-- قسم السجلات -->
    <div class="section-box">
        <div class="section-title">📋 سجل الذين تم الصرف لهم</div>
        <table id="recordsTable">
            <thead>
                <tr>
                    <th>اسم المريض</th>
                    <th>اسم الأم</th>
                    <th>الرقم الوطني</th>
                    <th>تاريخ الولادة</th>
                    <th>تفاصيل السماعة</th>
                    <th>الرقم التسلسلي</th>
                    <th>تاريخ الصرف</th>
                    <th>المؤسسة / المركز</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- بيانات ديناميكية -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code') || 'general';
    
    let currentCenter = "المؤسسة العامة";
    if (code === '10') currentCenter = "مركز الكود 10";
    else if (code === 'yarmok') currentCenter = "مستشفى اليرموك";
    else if (code === 'medicity') currentCenter = "مدينة الطب";

    document.getElementById('centerBadge').innerText = `المؤسسة / المركز: ${currentCenter}`;

    async function loadRecords() {
        try {
            const res = await fetch('/api/records');
            const data = await res.json();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            data.forEach(rec => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${rec.patientName || ''}</td>
                    <td>${rec.motherName || ''}</td>
                    <td>${rec.nationalId || ''}</td>
                    <td>${rec.birthDate || ''}</td>
                    <td>${rec.deviceDetails || ''}</td>
                    <td>${rec.serialNumber || ''}</td>
                    <td>${rec.date || ''}</td>
                    <td>${rec.center || currentCenter}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) {
            console.error("خطأ في جلب البيانات", e);
        }
    }

    async function saveRecord() {
        const day = document.getElementById('birthDay').value;
        const month = document.getElementById('birthMonth').value;
        const year = document.getElementById('birthYear').value;
        const birthDate = (day && month && year) ? `${day}/${month}/${year}` : '';

        const record = {
            nationalId: document.getElementById('nationalId').value,
            patientName: document.getElementById('patientName').value,
            motherName: document.getElementById('motherName').value,
            birthDate: birthDate,
            deviceDetails: document.getElementById('deviceDetails').value,
            serialNumber: document.getElementById('serialNumber').value,
            date: new Date().toISOString().split('T')[0],
            center: currentCenter
        };

        if (!record.patientName || !record.nationalId || !record.serialNumber) {
            alert("يرجى إدخال الحقول الأساسية (الرقم الوطني، اسم المريض، والرقم التسلسلي)");
            return;
        }

        const res = await fetch('/api/records', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(record)
        });

        if (res.ok) {
            alert("تم حفظ وتسجيل الصرف بنجاح");
            document.getElementById('nationalId').value = '';
            document.getElementById('patientName').value = '';
            document.getElementById('motherName').value = '';
            document.getElementById('birthDay').value = '';
            document.getElementById('birthMonth').value = '';
            document.getElementById('birthYear').value = '';
            document.getElementById('deviceDetails').value = '';
            document.getElementById('serialNumber').value = '';
            loadRecords();
        } else {
            alert("حدث خطأ أثناء الحفظ");
        }
    }

    async function checkEligibility() {
        const searchId = document.getElementById('searchNationalId').value.trim();
        const resultBox = document.getElementById('searchResult');
        if (!searchId) {
            alert("الرجاء إدخال الرقم الوطني للبحث");
            return;
        }
        try {
            const res = await fetch('/api/records');
            const data = await res.json();
            const found = data.find(r => r.nationalId === searchId);
            resultBox.style.display = "block";
            if (found) {
                resultBox.innerHTML = `⚠️ <b>المريض مسجل مسبقاً!</b> تم صرف سماعة له بتاريخ (${found.date}) من مركز (${found.center}). تفاصيل السماعة: ${found.deviceDetails}`;
                resultBox.style.background = "#fadbd8";
                resultBox.style.borderColor = "#f5b7b1";
            } else {
                resultBox.innerHTML = `✅ <b>المريض مؤهل للصرف.</b> لا يوجد سجل سابق لهذا الرقم الوطني، يمكنك إدخال بياناته في الأسفل وصرف السماعة.`;
                resultBox.style.background = "#e8f8f5";
                resultBox.style.borderColor = "#a3e4d7";
            }
        } catch (e) {
            console.error(e);
        }
    }

    loadRecords();
</script>

</body>
</html>
